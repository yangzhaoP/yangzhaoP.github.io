<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="免费在线贪吃蛇小游戏，电脑手机都能玩，无需下载。">
<title>贪吃周渝 · 在线小游戏</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b30;--line:#2a3652;--text:#f1f6ff;--muted:#9aabc8;--mint:#64edba;--gold:#fbd16e}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -20%,#263456 0%,#0b1020 55%);font-family:system-ui,-apple-system,"Microsoft Yahei",sans-serif;color:var(--text);display:flex;justify-content:center;padding:28px 16px 34px}
.shell{width:min(100%,660px)}header{text-align:center;margin-bottom:18px}.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--mint);font-weight:700}h1{margin:7px 0 8px;font-size:clamp(30px,6vw,44px);letter-spacing:.03em}header p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.panel{background:rgba(19,27,48,.94);border:1px solid var(--line);box-shadow:0 22px 65px #0005;border-radius:22px;padding:clamp(14px,4vw,24px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{padding:12px 8px;background:#0d1529;border:1px solid #24314d;border-radius:13px;text-align:center}.stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;margin-top:5px;font-size:25px;font-variant-numeric:tabular-nums}.stat:nth-child(2) strong{color:var(--gold)}.stat:nth-child(3) strong{color:var(--mint)}
.stage{position:relative;max-width:510px;margin:auto;aspect-ratio:1;background:#0b1426;border:2px solid #344463;border-radius:14px;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;background:rgba(5,10,24,.8);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;backdrop-filter:blur(3px)}.overlay[hidden]{display:none}.overlay-box{max-width:320px}.overlay .emoji{font-size:44px}.overlay h2{margin:10px 0;font-size:28px}.overlay p{color:#c0cee6;line-height:1.7;font-size:14px}.btn{border:0;border-radius:13px;padding:12px 22px;color:#091523;background:var(--mint);font-size:15px;font-weight:800;cursor:pointer;transition:transform .1s,filter .1s}.btn:hover{filter:brightness(1.09)}.btn:active,.control:active{transform:scale(.95)}.actions{display:flex;gap:10px;justify-content:center;margin:16px 0}.btn.alt{background:#293755;color:#f0f6ff;border:1px solid #405171}.btn:focus-visible,.control:focus-visible{outline:3px solid white;outline-offset:3px}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,54px);gap:8px;justify-content:center;margin:12px auto 4px}.control{border:1px solid #425374;border-radius:12px;background:#253351;color:#f3f8ff;font-size:23px;font-weight:700;touch-action:manipulation;cursor:pointer}.control[data-dir=up]{grid-column:2}.control[data-dir=left]{grid-column:1;grid-row:2}.control[data-dir=down]{grid-column:2;grid-row:2}.control[data-dir=right]{grid-column:3;grid-row:2}
.hint{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;margin-top:15px}.footer{text-align:center;font-size:12px;color:#7184a8;margin-top:20px}kbd{border:1px solid #405171;background:#253351;border-radius:5px;padding:2px 6px;color:#e5edff}button:disabled{opacity:.45;cursor:not-allowed}@media(min-width:740px){.pad{display:none}}@media(max-width:420px){body{padding:17px 10px 24px}.panel{border-radius:16px}.stats{gap:7px}.stat{padding:9px 5px}.stat strong{font-size:21px}}
</style>
</head>
<body>
<main class="shell">
<header><div class="eyebrow">FREE ONLINE GAME · 01</div><h1>🧒 贪吃周渝</h1><p>吃掉苹果，挑战最高分！无需下载，手机电脑直接玩。</p></header>
<section class="panel" aria-label="贪吃蛇游戏">
<div class="stats"><div class="stat"><span>本局得分</span><strong id="score">0</strong></div><div class="stat"><span>历史最高</span><strong id="best">0</strong></div><div class="stat"><span>当前等级</span><strong id="level">1</strong></div></div>
<div class="stage" id="stage"><canvas id="game" width="600" height="600" aria-label="贪吃周渝游戏棋盘"></canvas><div class="overlay" id="overlay"><div class="overlay-box"><div class="emoji" id="emoji">🎮</div><h2 id="overlay-title">准备好了吗？</h2><p id="overlay-desc">方向键或 WASD 控制方向，手机使用下方按钮，也可以在棋盘上滑动。</p><button class="btn" id="overlay-btn" type="button">开始游戏</button></div></div></div>
<div class="actions"><button class="btn alt" type="button" id="pause">暂停 / 继续</button><button class="btn alt" type="button" id="restart">重新开始</button></div>
<div class="pad" aria-label="手机方向控制"><button class="control" data-dir="up" aria-label="向上">↑</button><button class="control" data-dir="left" aria-label="向左">←</button><button class="control" data-dir="down" aria-label="向下">↓</button><button class="control" data-dir="right" aria-label="向右">→</button></div>
<p class="hint">电脑：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 WASD ｜ 空格暂停<br>手机：点击方向按钮或滑动棋盘</p>
</section>
<p class="footer">纯静态网页 · 无广告 · 不收集个人信息 · 本地保存最高分</p>
</main>
<script>
(()=>{'use strict';const snakeAvatar=new Image();snakeAvatar.onload=()=>{if(snake)paint()};snakeAvatar.src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAAwADADASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAABAYHBQIDAf/EAC4QAAIBAwIEBQMEAwAAAAAAAAECAwAEEQUSBhMhMQciQVFhFHGRNEJDgZKx8f/EABgBAAMBAQAAAAAAAAAAAAAAAAIEBQMA/8QAHREAAgMBAAMBAAAAAAAAAAAAAAECAxESBBQxIf/aAAwDAQACEQMRAD8Ahy6RduPKi/5UPJaSRuVbbkezU5akBZW0xRcEIMY9zSl1Y5Jo3zmoFdbjPFbWRu238139FNjOFx969FB9DRcZJjoAg/TuAta1W0S6tBayRN2P1CjH3FGjwt4mbOIbbocfqFph8Nb0pqVxZhjsePfj0DD/ALVRiLq7eXA+a05Rg7JbhFNaPOs3brgoPT2NZWkaQl+7K7Ht0xR11dBrTG3uhGD80fw9YTcrfbxmWQftD7cVhDVBIb+zCbDw/jYAzXBx8Cvt/wAKxW1nIYAxZU6H3NOMdpczaZIEKNKhK4J9R9qNtrCWLT1e7EXOK9RHnA/NcmG4rCf+HsTxa1cTMh2rEULegORVHnv52ES20asxfaxY4CisRha6WBDbxlS+6RznuaFOpEwEqcFj0/uqFVTlHWRr7ubMROYoX5Y3NnavTNNfBt4La9kW4AAYZHzWXpujalPM1qtnLz+nldCMdcZPxWzPw1f6fcvCx5jg/wAak9aSZThLHo1adfpzZ4tshAlJ3Ae9at3cxi3xnc3pjuaXtI0fWwq7Ukwep34FNdjozowacjPwcmg+P9GJS1CBJdG5vH6AjJU+9cpaSQhCqM43AjGe9Up+FdLmuDNJB5yuCVbb/r1rVt7K2trdYIoEWNRgDaDTvtxisRJfguUtbP/Z';
const N=20, canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level'),overlay=document.getElementById('overlay'),title=document.getElementById('overlay-title'),desc=document.getElementById('overlay-desc'),emoji=document.getElementById('emoji'),overlayBtn=document.getElementById('overlay-btn');
let snake,food,dir,nextDir,score=0,best=0,state='ready',timer=null,tickMs=155,turnQueued=false;
try{best=Number(localStorage.getItem('pyz-snake-best')||0)||0}catch(e){} bestEl.textContent=best;
function reset(){stop();snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nextDir={...dir};score=0;tickMs=155;turnQueued=false;scoreEl.textContent='0';levelEl.textContent='1';placeFood();paint()}
function placeFood(){const spaces=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(s=>s.x===x&&s.y===y))spaces.push({x,y});food=spaces.length?spaces[Math.floor(Math.random()*spaces.length)]:null}
function stop(){if(timer!==null){clearTimeout(timer);timer=null}}
function schedule(){stop();if(state==='running')timer=setTimeout(step,tickMs)}
function show(heading,message,symbol,button){title.textContent=heading;desc.textContent=message;emoji.textContent=symbol;overlayBtn.textContent=button;overlay.hidden=false}
function start(){reset();state='running';overlay.hidden=true;schedule()}
function pause(){if(state==='running'){state='paused';stop();show('已暂停','休息一下，继续挑战！','⏸️','继续游戏')}else if(state==='paused'){state='running';overlay.hidden=true;schedule()}else start()}
function gameOver(won=false){state='over';stop();show(won?'全部吃光了！':'游戏结束',won?'恭喜通关，得分 '+score+'！':'本局得分 '+score+'，再来挑战一次吧！',won?'🏆':'💥','再玩一次')}
function changeDirection(x,y){if(state==='ready'||state==='over')start();if(state!=='running'||turnQueued)return;if(x===-dir.x&&y===-dir.y)return;if(x===dir.x&&y===dir.y)return;nextDir={x,y};turnQueued=true}
function step(){if(state!=='running')return;dir=nextDir;turnQueued=false;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eat=food&&head.x===food.x&&head.y===food.y;const body=eat?snake:snake.slice(0,-1);
if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return}
snake.unshift(head);
if(eat){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('pyz-snake-best',String(best))}catch(e){}}tickMs=Math.max(65,155-Math.floor(score/50)*9);levelEl.textContent=String(1+Math.floor(score/50));placeFood();if(!food){paint();gameOver(true);return}}else snake.pop();
paint();schedule()}
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function paint(){const w=canvas.width,cell=w/N;ctx.fillStyle='#0b1426';ctx.fillRect(0,0,w,w);ctx.strokeStyle='#16233a';ctx.lineWidth=1;for(let i=1;i<N;i++){const p=i*cell;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,w);ctx.moveTo(0,p);ctx.lineTo(w,p);ctx.stroke()}
if(food){const cx=(food.x+.5)*cell,cy=(food.y+.5)*cell;ctx.fillStyle='#ff7489';ctx.beginPath();ctx.arc(cx,cy,cell*.33,0,2*Math.PI);ctx.fill();ctx.fillStyle='#83e9a5';ctx.beginPath();ctx.ellipse(cx+5,cy-10,6,3,-.5,0,2*Math.PI);ctx.fill()}
snake.forEach((s,i)=>{const pad=2,x=s.x*cell+pad,y=s.y*cell+pad;if(i===0){ctx.save();ctx.beginPath();ctx.roundRect(x,y,cell-pad*2,cell-pad*2,8);ctx.clip();if(snakeAvatar.complete&&snakeAvatar.naturalWidth){ctx.drawImage(snakeAvatar,x,y,cell-pad*2,cell-pad*2)}else{roundRect(x,y,cell-pad*2,cell-pad*2,8,'#a3ffdb')}ctx.restore();}else{roundRect(x,y,cell-pad*2,cell-pad*2,7,i%2===0?'#43d6a2':'#56e6b2')}})}
const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();pause();return}const d=dirs[e.key]||dirs[e.key.toLowerCase()];if(d){e.preventDefault();changeDirection(...d)}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];changeDirection(...d)}));
let touch=null;document.getElementById('stage').addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))changeDirection(Math.sign(dx),0);else changeDirection(0,Math.sign(dy))},{passive:true});
overlayBtn.addEventListener('click',()=>state==='paused'?pause():start());document.getElementById('pause').addEventListener('click',pause);document.getElementById('restart').addEventListener('click',start);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='running')pause()});reset();
})();
</script>
</body>
</html>

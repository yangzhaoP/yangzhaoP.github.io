'<div class="panel"><h3>🏮 怎样开始？</h3><p class="muted">首次进入已经拥有竹影武士、青灯书生和桃花灵，可以直接去「妖境探险」进行三人回合制战斗。</p></div>'+
'<div class="panel"><h3>📜 召唤规则</h3><p class="muted">单抽消耗 100 勾玉，十连消耗 900 勾玉。SSR 自上次获得 SSR 起，最多 50 抽必出。一次十连至少包含 SR 或 SSR。重复式灵获得金币。</p></div>'+
'<div class="panel"><h3>🔮 御灵符印</h3><p class="muted">挑战妖境有机会获得符印，可装备提升生命、攻击、防御或速度。存档与之前兼容。</p></div>'+
'<div class="panel"><h3>⚔️ 战斗与养成</h3><p class="muted">点击己方式灵选择行动者，再选择敌人，使用普攻或技能。普攻增加 1 灵力，技能消耗 2 灵力。治疗与护盾技能作用于己方，无需选择敌人。战斗胜利可赚取勾玉和金币，用金币升级式灵。</p></div>'+
'<div class="panel"><h3>💾 存档与隐私</h3><p class="muted">游戏在浏览器 localStorage 中保存式灵、货币与关卡进度。不同设备、无痕模式和不同浏览器的存档互不相通。没有账号系统、服务器数据库、广告或实际付费。</p>'+btn('清除当前游戏存档','reset-save','outline')+'</div>';
}
function render(){resources();nav();el('view').innerHTML=tab==='home'?home():tab==='roster'?roster():tab==='runes'?runesView():tab==='souls'?soulsView():tab==='story'?storyView():tab==='quests'?questsView():tab==='summon'?summonView():tab==='dungeon'?dungeon():guide();if(autoTimer!==null){clearTimeout(autoTimer);autoTimer=null;}if(tab==='dungeon'&&battle&&autoPlay&&battle.phase==='player'&&!animationBusy&&!pendingEnemy)autoTimer=setTimeout(autoTick,850);}
function goto(x){tab=x;render();window.scrollTo({top:0,behavior:'smooth'});}
function gift(){var today=new Date().toLocaleDateString('sv-SE');if(data.gift===today)return notify('今天的福袋已领过啦');data.gift=today;data.jade+=350;data.coins+=400;data.stamina=Math.min(99,data.stamina+6);save();render();notify('参拜成功！勾玉 +350、金币 +400、体力 +6');}
function train(id){var h=data.owned[id];if(!h)return;if(h.level>=30)return notify('式灵已达最高等级');var cost=h.level*75;if(data.coins<cost)return notify('金币不足，前往妖境挑战吧');data.coins-=cost;h.level++;save();render();notify(idmap[id].name+' 已升至 Lv.'+h.level);}
function team(id){if(!data.owned[id])return;var ix=data.team.indexOf(id);if(ix>=0){if(data.team.length<=1)return notify('至少要保留一名式灵');data.team.splice(ix,1);}else{if(data.team.length>=3)return notify('队伍最多三名，请先下阵一位');data.team.push(id);}save();render();}
function summon(count){var cost=count===10?900:100;if(data.jade<cost)return notify('勾玉不够，可以挑战妖境或领取每日福袋');data.jade-=cost;lastSummons=[];var hasHigh=false;for(var i=0;i<count;i++){var roll=Math.random(),g=data.pity>=49?'SSR':roll<.04?'SSR':roll<.22?'SR':'R';if(count===10&&i===9&&!hasHigh&&g==='R')g='SR';var pool=H.filter(function(x){return x.grade===g;});var h=pool[Math.floor(Math.random()*pool.length)];lastSummons.push(h);if(g!=='R')hasHigh=true;data.pulls++;data.pity=g==='SSR'?0:data.pity+1;var entry=data.owned[h.id];if(entry){entry.copies++;data.coins+=80;}else{data.owned[h.id]={level:1,copies:1};}}
save();render();notify('召唤完成！'+(lastSummons.some(function(x){return x.grade==='SSR';})?'恭喜获得 SSR！':'去式灵录查看新伙伴吧'));}
function rest(){if(data.stamina>=20)return notify('体力充足，继续挑战吧');if(data.coins<60)return notify('修行需要 60 金币');data.coins-=60;data.stamina=Math.min(20,data.stamina+3);save();render();notify('静心修行：体力 +3');}
function startBattle(){animationBusy=false;autoPlay=false;if(data.team.length!==3)return notify('需要三名式灵才能挑战，请在式灵录完成编队');if(data.stamina<2)return notify('体力不足，可以领取福袋或静心修行');data.stamina-=2;save();lastResult=null;battle={stage:data.maxStage,allies:data.team.map(function(id){var p=pow(id),h=idmap[id];return{id:id,name:h.name,emoji:h.emoji,hp:p.hp,maxHp:p.hp,atk:p.atk,def:p.def,spd:p.spd,shield:0,acted:false,skill:h.skill,mode:h.mode};}),enemies:stageEnemies(data.maxStage),energy:3,round:1,phase:'player',log:['妖境之门开启。准备迎战！']};chosen=0;target=0;pendingEnemy=false;buildTimeline();advanceTimeline();}
function nextAlive(side,index){if(side[index]&&side[index].hp>0)return index;var i=side.findIndex(function(e){return e.hp>0;});return i;}
function hit(attacker,victim,multi){var dmg=Math.max(1,Math.round((attacker.atk*multi-victim.def*.45)*(.9+Math.random()*.2)));var shield=Math.min(dmg,victim.shield||0);victim.shield=(victim.shield||0)-shield;victim.hp=Math.max(0,victim.hp-(dmg-shield));return dmg-shield;}
function log(t){battle.log.push(t);if(battle.log.length>35)battle.log.shift();}
function endBattle(win){animationBusy=false;autoPlay=false;var stage=battle.stage;if(win){data.wins++;var coin=120+stage*30;data.coins+=coin;data.jade+=130;data.maxStage=Math.max(data.maxStage,stage+1);var extra='';if(Math.random()<.48){var rune=RUNES[Math.floor(Math.random()*RUNES.length)];data.runes[rune.id]++;extra='、'+rune.name;}lastResult='🏆 妖境挑战成功！获得 130 勾玉、'+coin+' 金币'+extra+'，已解锁第 '+data.maxStage+' 关。';}else lastResult='💔 挑战失败。升级式灵，调整阵容后再战吧！';battle=null;pendingEnemy=false;save();render();notify(win?'挑战成功！':'队伍落败');}
function takeAction(action){
if(!battle||battle.phase!=='player'||pendingEnemy||animationBusy)return;
var actor=battle.allies[chosen],victim=battle.enemies[target];
if(!actor||actor.hp<=0||actor.acted||!victim||victim.hp<=0)return;
if(action==='special'&&battle.energy<2)return notify('灵力不足，先使用普通攻击');
var original=battle;
var mode=action==='normal'?'normal':actor.mode;
animationBusy=true;
render();
playBattleFx(mode,false,function(){
if(!battle||battle!==original||battle.phase!=='player')return;
animationBusy=false;
resolveAction(action);
});
}
function resolveAction(action){
if(!battle||battle.phase!=='player'||pendingEnemy)return;
chosen=nextAlive(battle.allies,chosen);target=nextAlive(battle.enemies,target);var a=battle.allies[chosen],e=battle.enemies[target];
if(!a||a.acted||!e)return;
if(action==='special'&&battle.energy<2)return notify('灵力不足，先使用普通攻击');
if(action==='normal'){var n=hit(a,e,1);battle.energy=Math.min(7,battle.energy+1);log(a.name+' 普攻 '+e.name+'，造成 '+n+' 点伤害。');}
else{
battle.energy-=2;
if(a.mode==='heal'){var base=Math.round(a.atk*1.1+23);battle.allies.forEach(function(f){if(f.hp>0)f.hp=Math.min(f.maxHp,f.hp+base);});log(a.name+' 施展「'+a.skill+'」，全队恢复 '+base+' 点生命。');}
else if(a.mode==='guard'){var shield=Math.round(a.atk*.65+24);battle.allies.forEach(function(f){if(f.hp>0)f.shield+=shield;});log(a.name+' 施展「'+a.skill+'」，全队获得 '+shield+' 点护盾。');}
else if(a.mode==='aoe'){var total=0;battle.enemies.forEach(function(f){if(f.hp>0)total+=hit(a,f,1.02);});log(a.name+' 施展「'+a.skill+'」，群体共造成 '+total+' 点伤害。');}
else{var ratio=a.mode==='burst'?2.7:1.85;var dmg=hit(a,e,ratio);log(a.name+' 施展「'+a.skill+'」，对 '+e.name+' 造成 '+dmg+' 点伤害！');}
}
a.acted=true;if(battle.enemies.every(function(f){return f.hp<=0;})){endBattle(true);return;}battle.cursor++;advanceTimeline();}
function autoTick(){autoTimer=null;if(!battle||!autoPlay||battle.phase!=='player'||animationBusy||pendingEnemy)return;var idx=chosen;if(!battle.allies[idx]||battle.allies[idx].hp<=0||battle.allies[idx].acted)return;chosen=idx;var enemies=battle.enemies.filter(function(x){return x.hp>0});if(!enemies.length)return;var lowest=enemies.slice().sort(function(a,b){return a.hp-b.hp})[0];target=battle.enemies.indexOf(lowest);var ally=battle.allies[idx];var lowHp=battle.allies.some(function(x){return x.hp>0&&x.hp<x.maxHp*.72});var skill=battle.energy>=2&&(ally.mode==='heal'?lowHp:ally.mode==='guard'?battle.allies.some(function(x){return x.hp>0&&x.shield<15}):true);takeAction(skill?'special':'normal');}
function nextUnacted(){var i=battle.allies.findIndex(function(f){return f.hp>0&&!f.acted;});return i<0?0:i;}
function buildTimeline(){
if(!battle)return;
var turns=[];
battle.allies.forEach(function(a,i){if(a.hp>0)turns.push({side:'ally',index:i,speed:a.spd||80,rank:i});});
battle.enemies.forEach(function(e,i){if(e.hp>0)turns.push({side:'enemy',index:i,speed:e.spd||65,rank:i});});
turns.sort(function(a,b){return b.speed-a.speed||(a.side===b.side?a.rank-b.rank:(a.side==='ally'?-1:1));});
battle.timeline=turns;battle.cursor=0;
}
function advanceTimeline(){
if(!battle)return;
if(battle.enemies.every(function(f){return f.hp<=0;})){endBattle(true);return;}
if(battle.allies.every(function(f){return f.hp<=0;})){endBattle(false);return;}
while(battle.cursor<battle.timeline.length){
var t=battle.timeline[battle.cursor],who=t.side==='ally'?battle.allies[t.index]:battle.enemies[t.index];
if(who&&who.hp>0)break;battle.cursor++;
}
if(battle.cursor>=battle.timeline.length){
battle.round++;battle.energy=Math.min(7,battle.energy+2);
battle.allies.forEach(function(f){f.acted=false;});
log('第 '+battle.round+' 回合开始，灵力恢复 2 点。');buildTimeline();
}
var turn=battle.timeline[battle.cursor];if(!turn)return;
battle.previewEnemy=null;battle.previewAlly=null;
if(turn.side==='ally'){
chosen=turn.index;target=nextAlive(battle.enemies,target);
battle.phase='player';pendingEnemy=false;animationBusy=false;render();return;
}
var attacker=battle.enemies[turn.index],living=battle.allies.filter(function(f){return f.hp>0;});
if(!living.length){endBattle(false);return;}
var victim=living[Math.floor(Math.random()*living.length)];
battle.previewEnemy=attacker;battle.previewAlly=victim;battle.phase='enemy';
pendingEnemy=true;animationBusy=true;render();var game=battle;
setTimeout(function(){
if(!battle||battle!==game||battle.phase!=='enemy')return;
playBattleFx('normal',true,function(){
if(!battle||battle!==game||battle.phase!=='enemy')return;
var damage=hit(attacker,victim,1);log(attacker.name+' 袭击 '+victim.name+'，造成 '+damage+' 点伤害。');
battle.previewAlly=null;battle.previewEnemy=null;battle.cursor++;animationBusy=false;pendingEnemy=false;
advanceTimeline();
});
},230);
}
document.addEventListener('click',function(evt){var b=evt.target.closest('button');if(!b)return;var next=b.getAttribute('data-tab');if(next){goto(next);return;}var act=b.getAttribute('data-act');if(!act)return;
if(act==='go-dungeon')goto('dungeon');
else if(act==='go-summon')goto('summon');
else if(act==='gift')gift();
else if(act==='train')train(b.getAttribute('data-id'));
else if(act==='team')team(b.getAttribute('data-id'));
else if(act==='equip')equipRune(b.getAttribute('data-id'),b.getAttribute('data-rune'));
else if(act==='draw1')summon(1);
else if(act==='draw10')summon(10);
else if(act==='rest')rest();
else if(act==='start-battle')startBattle();
else if(act==='choose-ally'){if(battle&&!animationBusy&&battle.phase==='player'){var i=Number(b.getAttribute('data-i'));if(i!==chosen)notify('请按行动条顺序行动');else render();}}
else if(act==='choose-target'){if(battle&&!animationBusy){var j=Number(b.getAttribute('data-i'));if(battle.enemies[j].hp>0){target=j;render();}}}
else if(act==='normal'||act==='special')takeAction(act);
else if(act==='toggle-auto'){if(battle){autoPlay=!autoPlay;render();notify(autoPlay?'已开启自动战斗':'已暂停自动战斗');}}
else if(act==='retreat'){if(battle&&!animationBusy){battle=null;autoPlay=false;pendingEnemy=false;lastResult='你选择了撤退，本次体力不退还。';render();}}
else if(act==='reset-save'){if(confirm('确认清除本游戏的所有进度？操作不可撤销。')){data=newState();battle=null;lastResult=null;lastSummons=[];save();goto('home');notify('存档已重置');}}
});
render();
})();
</script>
</body></html>

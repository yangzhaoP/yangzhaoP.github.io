'<div class="grid"><div class="tile"><span class="symbol">📜</span><h3>召唤百鬼</h3><p>R、SR、SSR 三种稀有度，10 连召唤保底至少一只 SR，50 抽必出 SSR。</p></div><div class="tile"><span class="symbol">⚔️</span><h3>三人共斗</h3><p>普攻积攒灵力，释放治疗、护盾和强力群攻，赢取勾玉和金币。</p></div><div class="tile"><span class="symbol">🌸</span><h3>养成式灵</h3><p>使用金币提升式灵等级，调整上阵阵容，攻克不断变强的妖境。</p></div></div>'+
'<div class="divider"></div>'+header('出战队伍','你可以在「式灵录」调整三人阵容。')+teamStrip()+
'<div class="panel"><h3>🎁 每日参拜</h3><p class="muted">每天可领取免费勾玉、金币和体力，不需要登录。</p>'+btn(data.gift===new Date().toLocaleDateString('sv-SE')?'今天已经领取':'领取今日福袋','gift','gold',data.gift===new Date().toLocaleDateString('sv-SE')?'disabled':'')+'</div>';
}
function roster(){
return header('式灵录','收集原创式灵，升级并组成最多三人的出战队伍。','<span class="pill">已收集 '+Object.keys(data.owned).length+' / '+H.length+'</span>')+
teamStrip()+'<div class="cards">'+H.map(function(h){return heroCard(h,'roster');}).join('')+'</div><div class="notice">升级需要金币。普通攻击可获得灵力，技能消耗 2 点灵力；治疗型式灵在困难关卡非常有用。</div>';
}
function summon(){
var results=lastSummons.length?'<div class="divider"></div><h3>本次召唤</h3><div class="result-list">'+lastSummons.map(function(h){return '<div class="result '+h.grade.toLowerCase()+'"><div class="symbol">'+h.emoji+'</div><h4>'+h.name+'</h4>'+grade(h)+'</div>';}).join('')+'</div>':'';
return header('式灵召唤','借助勾玉召唤新的式灵，重复召唤也会转化为金币。')+
'<div class="panel summon-area"><div class="summon-circle" aria-hidden="true">🔮</div><h3>唤灵之阵</h3><p class="muted">普通 R 78% · 稀有 SR 18% · 传说 SSR 4%</p><p class="tiny">距 SSR 硬保底最多还有 '+(50-data.pity)+' 抽 · 已召唤 '+data.pulls+' 次</p><div class="buttons" style="justify-content:center;margin-top:18px">'+btn('召唤一次 · 100勾玉','draw1','outline')+btn('十连召唤 · 900勾玉','draw10','gold')+'</div><p class="tiny">十连召唤至少获得一名 SR 或 SSR。所有奖励仅为游戏内道具，无法购买或兑换现金。</p></div>'+results;
}
function stageEnemies(stage){var sprites=[['山狐','🦊'],['雾鬼','👻'],['石灵','🪨'],['夜鸦','🐦‍⬛'],['荒狼','🐺'],['幽灯','🔥']];var a=[];for(var i=0;i<3;i++){var v=sprites[(stage*2+i)%sprites.length],boss=(stage%5===0&&i===2),hp=70+stage*20+(boss?110:0);a.push({id:'e'+i,name:boss?'妖境首领 · '+v[0]:v[0],emoji:v[1],hp:hp,maxHp:hp,atk:14+stage*4+(boss?12:0),def:4+stage*2,boss:boss,shield:0});}return a;}
function health(f){return Math.max(0,Math.round(f.hp/f.maxHp*100));}
function fighter(x,i,ally){var sel=ally?i===chosen:i===target,cl=x.hp<=0?'down':sel?'selected selectable':'selectable';
return '<button class="fighter '+cl+'" '+(x.hp<=0?'disabled':'')+' data-act="'+(ally?'choose-ally':'choose-target')+'" data-i="'+i+'"><span class="symbol">'+x.emoji+'</span><div class="desc"><b>'+x.name+(x.shield>0?' 🛡️':'')+'</b><small>HP '+x.hp+' / '+x.maxHp+(ally?' · '+(x.acted?'已行动':'待行动'):'')+'</small><div class="meter '+(!ally?'red':'')+'"><span class="fill" style="width:'+health(x)+'%"></span></div></div></button>';}
function dungeon(){
if(!battle){
var desc='<div class="panel center"><div style="font-size:67px">🏯</div><h2>妖境 · 第 '+data.maxStage+' 关</h2><p class="muted">每次挑战消耗 2 体力；胜利获得 130 勾玉、'+(120+data.maxStage*30)+' 金币。<br>每 5 关出现强力首领。</p><p class="tiny">挑战前请在式灵录里选择三名伙伴。</p>'+teamStrip()+btn('进入妖境 · 消耗2体力','start-battle','gold')+' '+btn('静心修行 · 恢复3体力','rest','outline')+'</div>';
if(lastResult)desc='<div class="notice">'+lastResult+'</div>'+desc;
return header('妖境探险','以智谋搭配技能，挑战不断变强的妖怪。')+desc;
}
var chosenHero=battle.allies[chosen];var can=battle.phase==='player'&&chosenHero&&chosenHero.hp>0&&!chosenHero.acted;
return header('妖境 · 第 '+battle.stage+' 关','第 '+battle.round+' 回合 · '+(battle.phase==='enemy'?'妖怪正在行动':'请选择己方式灵和攻击目标'),' <span class="pill">✨ 灵力 '+battle.energy+' / 7</span>')+
'<p class="versus">提示：点左侧选择己方式灵，点右侧选择目标。普通攻击恢复 1 点灵力，技能消耗 2 点。</p>'+
'<div class="battle-grid"><div><div class="side-label">己方 · 式灵</div><div class="fighters">'+battle.allies.map(function(x,i){return fighter(x,i,true);}).join('')+'</div></div><div><div class="side-label">敌方 · 妖怪</div><div class="fighters">'+battle.enemies.map(function(x,i){return fighter(x,i,false);}).join('')+'</div></div></div>'+
'<div class="battle-controls">'+btn('普通攻击 · +1灵力','normal','outline',can?'':'disabled')+btn(chosenHero?chosenHero.skill+' · 2灵力':'灵术','special','gold',can&&battle.energy>=2?'':'disabled')+btn('撤退','retreat','outline')+'</div>'+
'<div class="battle-log" aria-label="战斗记录">'+battle.log.slice(-8).reverse().map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>';
}
function guide(){return header('冒险指南','这是独立制作的原创和风小游戏，不含任何官方游戏素材。')+
'<div class="panel"><h3>🏮 怎样开始？</h3><p class="muted">首次进入已经拥有竹影武士、青灯书生和桃花灵，可以直接去「妖境探险」进行三人回合制战斗。</p></div>'+
'<div class="panel"><h3>📜 召唤规则</h3><p class="muted">单抽消耗 100 勾玉，十连消耗 900 勾玉。SSR 自上次获得 SSR 起，最多 50 抽必出。一次十连至少包含 SR 或 SSR。重复式灵获得金币。</p></div>'+
'<div class="panel"><h3>⚔️ 战斗与养成</h3><p class="muted">点击己方式灵选择行动者，再选择敌人，使用普攻或技能。普攻增加 1 灵力，技能消耗 2 灵力。治疗与护盾技能作用于己方，无需选择敌人。战斗胜利可赚取勾玉和金币，用金币升级式灵。</p></div>'+
'<div class="panel"><h3>💾 存档与隐私</h3><p class="muted">游戏在浏览器 localStorage 中保存式灵、货币与关卡进度。不同设备、无痕模式和不同浏览器的存档互不相通。没有账号系统、服务器数据库、广告或实际付费。</p>'+btn('清除当前游戏存档','reset-save','outline')+'</div>';
}
function render(){resources();nav();el('view').innerHTML=tab==='home'?home():tab==='roster'?roster():tab==='summon'?summon():tab==='dungeon'?dungeon():guide();}
function goto(x){tab=x;render();window.scrollTo({top:0,behavior:'smooth'});}
function gift(){var today=new Date().toLocaleDateString('sv-SE');if(data.gift===today)return notify('今天的福袋已领过啦');data.gift=today;data.jade+=350;data.coins+=400;data.stamina=Math.min(99,data.stamina+6);save();render();notify('参拜成功！勾玉 +350、金币 +400、体力 +6');}
function train(id){var h=data.owned[id];if(!h)return;if(h.level>=30)return notify('式灵已达最高等级');var cost=h.level*75;if(data.coins<cost)return notify('金币不足，前往妖境挑战吧');data.coins-=cost;h.level++;save();render();notify(idmap[id].name+' 已升至 Lv.'+h.level);}
function team(id){if(!data.owned[id])return;var ix=data.team.indexOf(id);if(ix>=0){if(data.team.length<=1)return notify('至少要保留一名式灵');data.team.splice(ix,1);}else{if(data.team.length>=3)return notify('队伍最多三名，请先下阵一位');data.team.push(id);}save();render();}
function summon(count){var cost=count===10?900:100;if(data.jade<cost)return notify('勾玉不够，可以挑战妖境或领取每日福袋');data.jade-=cost;lastSummons=[];var hasHigh=false;for(var i=0;i<count;i++){var roll=Math.random(),g=data.pity>=49?'SSR':roll<.04?'SSR':roll<.22?'SR':'R';if(count===10&&i===9&&!hasHigh&&g==='R')g='SR';var pool=H.filter(function(x){return x.grade===g;});var h=pool[Math.floor(Math.random()*pool.length)];lastSummons.push(h);if(g!=='R')hasHigh=true;data.pulls++;data.pity=g==='SSR'?0:data.pity+1;var entry=data.owned[h.id];if(entry){entry.copies++;data.coins+=80;}else{data.owned[h.id]={level:1,copies:1};}}
save();render();notify('召唤完成！'+(lastSummons.some(function(x){return x.grade==='SSR';})?'恭喜获得 SSR！':'去式灵录查看新伙伴吧'));}
function rest(){if(data.stamina>=20)return notify('体力充足，继续挑战吧');if(data.coins<60)return notify('修行需要 60 金币');data.coins-=60;data.stamina=Math.min(20,data.stamina+3);save();render();notify('静心修行：体力 +3');}
function startBattle(){if(data.team.length!==3)return notify('需要三名式灵才能挑战，请在式灵录完成编队');if(data.stamina<2)return notify('体力不足，可以领取福袋或静心修行');data.stamina-=2;save();lastResult=null;battle={stage:data.maxStage,allies:data.team.map(function(id){var p=pow(id),h=idmap[id];return{id:id,name:h.name,emoji:h.emoji,hp:p.hp,maxHp:p.hp,atk:p.atk,def:p.def,shield:0,acted:false,skill:h.skill,mode:h.mode};}),enemies:stageEnemies(data.maxStage),energy:3,round:1,phase:'player',log:['妖境之门开启。准备迎战！']};chosen=0;target=0;pendingEnemy=false;render();}
function nextAlive(side,index){if(side[index]&&side[index].hp>0)return index;var i=side.findIndex(function(e){return e.hp>0;});return i;}
function hit(attacker,victim,multi){var dmg=Math.max(1,Math.round((attacker.atk*multi-victim.def*.45)*(.9+Math.random()*.2)));var shield=Math.min(dmg,victim.shield||0);victim.shield=(victim.shield||0)-shield;victim.hp=Math.max(0,victim.hp-(dmg-shield));return dmg-shield;}
function log(t){battle.log.push(t);if(battle.log.length>35)battle.log.shift();}
function endBattle(win){var stage=battle.stage;if(win){data.wins++;var coin=120+stage*30;data.coins+=coin;data.jade+=130;data.maxStage=Math.max(data.maxStage,stage+1);lastResult='🏆 妖境挑战成功！获得 130 勾玉、'+coin+' 金币，已解锁第 '+data.maxStage+' 关。';}else lastResult='💔 挑战失败。升级式灵，调整阵容后再战吧！';battle=null;pendingEnemy=false;save();render();notify(win?'挑战成功！':'队伍落败');}
function takeAction(action){
if(!battle||battle.phase!=='player'||pendingEnemy)return;
chosen=nextAlive(battle.allies,chosen);target=nextAlive(battle.enemies,target);var a=battle.allies[chosen],e=battle.enemies[target];
if(!a||a.acted||!e)return;
if(action==='special'&&battle.energy<2)return notify('灵力不足，先使用普通攻击');
if(action==='normal'){var n=hit(a,e,1);battle.energy=Math.min(7,battle.energy+1);log(a.name+' 普攻 '+e.name+'，造成 '+n+' 点伤害。');}
else{
battle.energy-=2;
if(a.mode==='heal'){var base=Math.round(a.atk*1.1+23);battle.allies.forEach(function(f){if(f.hp>0)f.hp=Math.min(f.maxHp,f.hp+base);});log(a.name+' 施展「'+a.skill+'」，全队恢复 '+base+' 点生命。');}
else if(a.mode==='guard'){var shield=Math.round(a.atk*.65+24);battle.allies.forEach(function(f){if(f.hp>0)f.shield+=shield;});log(a.name+' 施展「'+a.skill+'」，全队获得 '+shield+' 点护盾。');}
else if(a.mode==='aoe'){var total=0;battle.enemies.forEach(function(f){if(f.hp>0)total+=hit(a,f,1.02);});log(a.name+' 施展「'+a.skill+'」，群体共造成 '+total+' 点伤害。');}
else{var ratio=a.mode==='burst'?2.7:1.85;var dmg=hit(a,e,ratio);log(a.name+' 施展「'+a.skill+'」，对 '+e.name+' 造成 '+dmg+' 点伤害！');}
}
a.acted=true;
if(battle.enemies.every(function(f){return f.hp<=0;})){endBattle(true);return;}
if(battle.allies.filter(function(f){return f.hp>0;}).every(function(f){return f.acted;})){battle.phase='enemy';pendingEnemy=true;render();setTimeout(enemyTurn,600);}else{chosen=nextUnacted();target=nextAlive(battle.enemies,target);render();}
}
function nextUnacted(){var i=battle.allies.findIndex(function(f){return f.hp>0&&!f.acted;});return i<0?0:i;}
function enemyTurn(){
if(!battle||battle.phase!=='enemy')return;
battle.enemies.forEach(function(e){if(e.hp<=0)return;var living=battle.allies.filter(function(f){return f.hp>0;});if(!living.length)return;var targetF=living[Math.floor(Math.random()*living.length)];var dmg=hit(e,targetF,1);log(e.name+' 袭击 '+targetF.name+'，造成 '+dmg+' 点伤害。');});
if(battle.allies.every(function(f){return f.hp<=0})){endBattle(false);return;}
battle.round++;battle.phase='player';battle.energy=Math.min(7,battle.energy+2);battle.allies.forEach(function(f){f.acted=false;});chosen=nextUnacted();target=nextAlive(battle.enemies,target);pendingEnemy=false;log('第 '+battle.round+' 回合开始，灵力恢复 2 点。');render();
}
document.addEventListener('click',function(evt){var b=evt.target.closest('button');if(!b)return;var next=b.getAttribute('data-tab');if(next){goto(next);return;}var act=b.getAttribute('data-act');if(!act)return;
if(act==='go-dungeon')goto('dungeon');
else if(act==='go-summon')goto('summon');
else if(act==='gift')gift();
else if(act==='train')train(b.getAttribute('data-id'));
else if(act==='team')team(b.getAttribute('data-id'));
else if(act==='draw1')summon(1);
else if(act==='draw10')summon(10);
else if(act==='rest')rest();
else if(act==='start-battle')startBattle();
else if(act==='choose-ally'){if(battle&&battle.phase==='player'){var i=Number(b.getAttribute('data-i'));if(battle.allies[i].hp>0&&!battle.allies[i].acted){chosen=i;render();}}}
else if(act==='choose-target'){if(battle){var j=Number(b.getAttribute('data-i'));if(battle.enemies[j].hp>0){target=j;render();}}}
else if(act==='normal'||act==='special')takeAction(act);
else if(act==='retreat'){if(battle){battle=null;pendingEnemy=false;lastResult='你选择了撤退，本次体力不退还。';render();}}
else if(act==='reset-save'){if(confirm('确认清除本游戏的所有进度？操作不可撤销。')){data=newState();battle=null;lastResult=null;lastSummons=[];save();goto('home');notify('存档已重置');}}
});
render();
})();
</script>
</body></html>
